[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmd-python-backend"
version = "0.1.0"
description = "Python backend for AgentMd"
requires-python = ">=3.10"
authors = [{ name = "AntsugDev", email = "antonio.sugamele@gmail.com" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "better-sqlite3>=4.0.0",
  "click>=8.1.0",
  "apscheduler>=3.10.4",
  "openai>=1.0.0",
  "anthropic>=0.24.0",
  "google-generativeai>=0.6.0",
  "mistralai>=1.0.0",
  "ollama>=0.0.13",
]

[project.scripts]
agentmd = "agentmd.cli:main"

[tool.setuptools]
packages = ["agentmd"]
